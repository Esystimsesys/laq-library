<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ジョイントの継ぎ目確認</title>
<style>body{margin:0;background:#f6f8fa;font:16px system-ui;color:#243747}h1{margin:20px;font-size:22px}main{display:grid;grid-template-columns:repeat(4,1fr)}section{text-align:center}main{min-width:900px}canvas{width:100%;height:350px;touch-action:none;cursor:grab}body{overflow-x:auto}h2{margin:8px}p{margin:8px}button{padding:12px;margin:8px}</style>
<h1>No.3・5・6・7 — 同じ色・同じ倍率で比較</h1><button onclick="draw([1.4,1.5,2.2])">斜め</button><button onclick="draw([0,0,3])">正面</button><button onclick="draw([3,0.01,0])">端面</button><button onclick="draw([1.4,-1.5,-2.2])">裏側</button><p>図をドラッグすると4つとも同じ向きに回ります。外周・溝・端のくぼみと、表面の不要な継ぎ目を見比べられます。</p><main></main><p>No.6・7の中央の四角は3.5 mm、長さは17 mm。No.7の細部は実物写真で未確認です。</p>
<script src="../../public/assemblies/vendor/three.min.js"></script><script src="../../public/assemblies/viewer/realistic-parts.js"></script><script>
const T=THREE, views=[];let drag=null;
for(const no of [3,5,6,7]){
 const section=document.createElement('section');section.innerHTML=`<h2>No.${no}</h2>`;document.querySelector('main').append(section);
 const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(400,350);renderer.setPixelRatio(1.5);section.append(renderer.domElement);
 const scene=new T.Scene();scene.background=new T.Color('#f6f8fa');scene.add(new T.HemisphereLight(0xffffff,0x879bac,1));const light=new T.DirectionalLight(0xffffff,.9);light.position.set(2,3,4);scene.add(light);
 const material=new T.MeshStandardMaterial({color:0xaadc32,roughness:.46,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
 const part=LaQRealisticParts.joint(T,{id:'sample',partNo:no,pose:{center:[0,0,0],axis:[1,0,0]}},null,new Map(),material);
 part.traverse(o=>{if(o.isMesh){const e=new T.LineSegments(new T.EdgesGeometry(o.geometry,40),new T.LineBasicMaterial({color:material.color.clone().multiplyScalar(.42),transparent:true,opacity:.58,depthTest:true,depthWrite:false}));o.add(e)}});scene.add(part);
 const camera=new T.OrthographicCamera(-.72,.72,.63,-.63,.01,20);views.push({renderer,scene,camera,part});
}
for(const view of views){const canvas=view.renderer.domElement;canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY};});canvas.addEventListener("pointermove",e=>{if(!drag)return;const dx=(e.clientX-drag.x)*.008,dy=(e.clientY-drag.y)*.008;drag={x:e.clientX,y:e.clientY};for(const v of views){v.camera.position.applyAxisAngle(new T.Vector3(0,1,0),-dx);const right=new T.Vector3(1,0,0).applyQuaternion(v.camera.quaternion);v.camera.position.applyAxisAngle(right,-dy);v.camera.lookAt(0,.02,0);v.renderer.render(v.scene,v.camera);}});canvas.addEventListener("pointerup",()=>drag=null);canvas.addEventListener("lostpointercapture",()=>drag=null);}
function draw(pos){for(const v of views){v.camera.position.set(...pos);v.camera.lookAt(0,.02,0);v.renderer.render(v.scene,v.camera)}}draw([1.4,1.5,2.2]);
</script>
