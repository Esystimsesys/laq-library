name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 走っている配信を止めずに、後から来たものを待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # 実ブラウザでの画面確認。build:pages と同じサブパス配信で動かす
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # GITHUB_PAGES=true でサブディレクトリ配信用のパスに切り替え、404.html も作る
      - run: npm run build:pages
      # Pages の有効化はここではできない（GITHUB_TOKEN に権限が無く
      # enablement: true は Resource not accessible by integration で落ちる）。
      # リポジトリ設定側で Source を GitHub Actions にしておくこと。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
